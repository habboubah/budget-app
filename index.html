    THESIS: The household book on the kitchen table — the Excel sheet Ahmad

    the account right now, and what will be left at the end of the month once
    everything still open is paid. Below, the month reads top to bottom in the
    order money actually moves: income first, then the fixed costs, the car,
    the extras. A bill that is still to pay is drawn as an open ring; paying
    it is one tap that fills the ring and moves the "now" number.
