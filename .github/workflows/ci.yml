name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The privacy and performance checks drive the built app in Chromium.
      - run: npx playwright install --with-deps chromium
      # lint, tests (money rules, old payloads, the golden year), the build,
      # the privacy check (no request leaves the app; every URL in the bundle
      # is on the allowlist), the performance budgets and the contrast audit.
      - run: npm run check
