<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Banknotes — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(-8 120 120)">
      <rect x="38" y="62" width="172" height="100" rx="14" fill="#3E9B62" transform="rotate(-13 124 112)"/>
      <rect x="30" y="84" width="180" height="104" rx="14" fill="#5BBF83"/>
      <rect x="42" y="96" width="156" height="80" rx="8" fill="none" stroke="#BFEACD" stroke-width="5"/>
      <circle cx="120" cy="136" r="27" fill="#BFEACD"/>
      <g fill="none" stroke="#2E7D4F" stroke-width="7" stroke-linecap="round"><path d="M131.3 126.4A12.3 12.3 0 1 0 131.3 145.6"/><path d="M107.0 132.1H124.7"/><path d="M107.0 139.9H124.7"/></g>
      <circle cx="62" cy="136" r="7" fill="#BFEACD"/><circle cx="178" cy="136" r="7" fill="#BFEACD"/>
    </g>
  </g>
</svg>
