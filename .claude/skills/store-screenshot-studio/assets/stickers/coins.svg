<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Stack of coins — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(-6 120 120)">
      <path d="M52 172V188A72 22 0 0 0 196 188V172Z" fill="#D9A030"/><ellipse cx="124" cy="172" rx="72" ry="22" fill="#F0C050"/><ellipse cx="124" cy="172" rx="50" ry="13" fill="none" stroke="#D9A030" stroke-width="5"/>
      <path d="M42 136V152A72 22 0 0 0 186 152V136Z" fill="#D9A030"/><ellipse cx="114" cy="136" rx="72" ry="22" fill="#F0C050"/><ellipse cx="114" cy="136" rx="50" ry="13" fill="none" stroke="#D9A030" stroke-width="5"/>
      <path d="M54 100V116A72 22 0 0 0 198 116V100Z" fill="#D9A030"/><ellipse cx="126" cy="100" rx="72" ry="22" fill="#F0C050"/><ellipse cx="126" cy="100" rx="50" ry="13" fill="none" stroke="#D9A030" stroke-width="5"/>
      <path d="M70 92A58 16 0 0 1 112 81" fill="none" stroke="#FBDD8A" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
