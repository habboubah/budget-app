<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Piggy bank — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(-6 120 120)">
      <circle cx="112" cy="40" r="20" fill="#F0C050"/>
      <circle cx="112" cy="40" r="12" fill="none" stroke="#D9A030" stroke-width="4"/>
      <rect x="62" y="170" width="26" height="36" rx="10" fill="#E98BA0"/>
      <rect x="140" y="170" width="26" height="36" rx="10" fill="#E98BA0"/>
      <path d="M36 122C24 118 20 104 30 98" fill="none" stroke="#E98BA0" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="114" cy="130" rx="82" ry="62" fill="#F6A9B8"/>
      <path d="M32 130A82 62 0 0 0 196 130A82 44 0 0 1 32 130Z" fill="#EE94A8"/>
      <path d="M150 78L186 58L180 98Z" fill="#E98BA0"/>
      <rect x="178" y="112" width="40" height="44" rx="18" fill="#E98BA0"/>
      <circle cx="194" cy="134" r="4.5" fill="#B85C74"/><circle cx="208" cy="134" r="4.5" fill="#B85C74"/>
      <circle cx="158" cy="108" r="6.5" fill="#5A2A38"/>
      <rect x="84" y="74" width="56" height="11" rx="5.5" fill="#B85C74"/>
    </g>
  </g>
</svg>
