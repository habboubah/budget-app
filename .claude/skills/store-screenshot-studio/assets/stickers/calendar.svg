<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Calendar — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(-9 120 120)">
      <rect x="44" y="46" width="152" height="158" rx="22" fill="#FFFFFF"/>
      <path d="M44 68Q44 46 66 46H174Q196 46 196 68V96H44Z" fill="#E8594A"/>
      <path d="M160 46H174Q196 46 196 68V96H160Z" fill="#D2483A"/>
      <rect x="78" y="30" width="14" height="36" rx="7" fill="#7A2A21"/>
      <rect x="148" y="30" width="14" height="36" rx="7" fill="#7A2A21"/>
      <rect x="66" y="112" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="95" y="112" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="124" y="112" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="153" y="112" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="66" y="139" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="95" y="139" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="124" y="139" width="20" height="18" rx="5" fill="#0A6D80"/><rect x="153" y="139" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="66" y="166" width="20" height="18" rx="5" fill="#F0C050"/><rect x="95" y="166" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="124" y="166" width="20" height="18" rx="5" fill="#D5DCE5"/><rect x="153" y="166" width="20" height="18" rx="5" fill="#D5DCE5"/>
    </g>
  </g>
</svg>
