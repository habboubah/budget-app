<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Calculator — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(10 120 120)">
      <rect x="62" y="24" width="120" height="196" rx="22" fill="#34435C"/>
      <path d="M150 24H160Q182 24 182 46V198Q182 220 160 220H150Z" fill="#2A374D"/>
      <rect x="78" y="42" width="88" height="44" rx="9" fill="#CDEDE4"/>
      <rect x="118" y="57" width="36" height="14" rx="7" fill="#5E9C8C"/>
      <rect x="82" y="104" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="110" y="104" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="138" y="104" width="20" height="17" rx="5" fill="#E8594A"/><rect x="82" y="129" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="110" y="129" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="138" y="129" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="82" y="154" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="110" y="154" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="138" y="154" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="82" y="179" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="110" y="179" width="20" height="17" rx="5" fill="#F4F7FA"/><rect x="138" y="179" width="20" height="17" rx="5" fill="#F0C050"/>
    </g>
  </g>
</svg>
