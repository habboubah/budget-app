<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Receipt — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(9 120 120)">
      <path d="M62 26H178V200L163.500 214L149 200L134.500 214L120 200L105.500 214L91 200L76.500 214L62 200Z" fill="#FFFFFF"/>
      <path d="M150 26H178V200L163.500 214L150 201Z" fill="#E9EEF3"/>
      <rect x="80" y="50" width="60" height="12" rx="6" fill="#0A6D80"/>
      <rect x="80" y="80" width="80" height="9" rx="4.5" fill="#C5CFDA"/>
      <rect x="80" y="102" width="62" height="9" rx="4.500" fill="#C5CFDA"/>
      <rect x="80" y="124" width="74" height="9" rx="4.500" fill="#C5CFDA"/>
      <path d="M80 150H160" fill="none" stroke="#C5CFDA" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>
      <rect x="80" y="164" width="34" height="13" rx="6.5" fill="#8C97A6"/>
      <rect x="124" y="164" width="36" height="13" rx="6.5" fill="#E8594A"/>
    </g>
  </g>
</svg>
