<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Wallet — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(7 120 120)">
      <rect x="64" y="42" width="120" height="74" rx="10" fill="#5BBF83" transform="rotate(-9 124 80)"/>
      <rect x="76" y="54" width="96" height="50" rx="5" fill="none" stroke="#BFEACD" stroke-width="5" transform="rotate(-9 124 80)"/>
      <rect x="30" y="78" width="176" height="124" rx="24" fill="#B8733F"/>
      <path d="M30 150H206V178Q206 202 182 202H54Q30 202 30 178Z" fill="#A5632F"/>
      <path d="M150 116H214Q222 116 222 124V160Q222 168 214 168H150Q136 168 136 142Q136 116 150 116Z" fill="#8C4F24"/>
      <circle cx="166" cy="142" r="12" fill="#F0C050"/>
      <path d="M46 96H190" fill="none" stroke="#D99A66" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 13"/>
    </g>
  </g>
</svg>
