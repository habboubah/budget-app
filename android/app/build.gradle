apply plugin: 'com.android.application'

def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version.toString()
def appVersionParts = appVersion.tokenize('.').collect { it.toInteger() }
// 1.2.7 becomes 1020700; a second upload of the same version adds ANDROID_BUILD (1–99).
def appBuild = (System.getenv('ANDROID_BUILD') ?: '0').toInteger()
def appVersionCode = appVersionParts[0] * 1000000 + appVersionParts[1] * 10000 + appVersionParts[2] * 100 + appBuild

// The upload key (never in the repository): scripts/release-android.js passes it from .env.release.
def releaseStore = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace = "com.habboubah.spartopf"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.habboubah.spartopf"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // One version for both stores: package.json's.
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStore) signingConfig signingConfigs.release
            // R8 on: Play gets the mapping file (inside the AAB) for readable crash and ANR reports.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Google services, no Firebase, no analytics (plan 23): the app has no push and reports nothing.
