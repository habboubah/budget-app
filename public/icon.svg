<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Spartopf: the household book. A cream ledger with a teal spine and a gold euro coin on its cover, on the hero teal. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F8496"/>
      <stop offset="0.5" stop-color="#076070"/>
      <stop offset="1" stop-color="#043944"/>
    </linearGradient>
    <radialGradient id="sheen" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FBDD8A"/>
      <stop offset="0.5" stop-color="#F0C050"/>
      <stop offset="1" stop-color="#D9A030"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE8DB"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDD8CA"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="coverclip">
      <rect x="292" y="190" width="440" height="560" rx="40"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g transform="translate(522 512) scale(1.1) translate(-522 -512)">
    <ellipse cx="522" cy="794" rx="270" ry="26" fill="#000000" fill-opacity="0.45" filter="url(#soft)"/>
    <rect x="300" y="216" width="452" height="560" rx="40" fill="#CFCABB"/>
    <rect x="312" y="206" width="434" height="560" rx="30" fill="url(#pages)"/>
    <rect x="292" y="190" width="440" height="560" rx="40" fill="url(#cover)"/>
    <rect x="292" y="190" width="78" height="560" fill="#0A6D80" clip-path="url(#coverclip)"/>
    <circle cx="551" cy="440" r="132" fill="url(#gold)"/>
    <circle cx="551" cy="440" r="92.4" fill="none" stroke="#B9862A" stroke-opacity="0.55" stroke-width="9.2"/>
    <g fill="none" stroke="#8A5E0E" stroke-width="19" stroke-linecap="round">
      <path d="M592.2 397.4 A54 54 0 1 0 592.2 482.6"/>
      <path d="M485 423 H563"/>
      <path d="M485 457 H563"/>
    </g>
  </g></svg>
